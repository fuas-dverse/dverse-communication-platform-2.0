name: Build ADR Documentation

concurrency:
  group: adr-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'documents/adr/**.tex'
      - 'documents/adr/Makefile'
    tags:
      - 'sprint/**'

  # Trigger on sprint release tags, e.g. sprint/1, sprint/2


  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  build-adrs:
    name: Compile ADR PDFs
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to upload release assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live (minimal + required packages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            make

      - name: Build all ADR PDFs
        working-directory: documents/adr
        run: make all

      - name: Upload PDFs as workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: adr-pdfs-${{ github.sha }}
          path: documents/adr/build/*.pdf
          retention-days: 90

      # ── Sprint release: attach PDFs to the GitHub Release ──────────────
      - name: Attach PDFs to sprint release
        if: startsWith(github.ref, 'refs/tags/sprint/')
        uses: softprops/action-gh-release@v2
        with:
          files: documents/adr/build/*.pdf
          tag_name: ${{ github.ref_name }}
          name: "Sprint release – ${{ github.ref_name }}"
          body: |
            Automated documentation build for ${{ github.ref_name }}.
            PDFs compiled from `.tex` sources at commit `${{ github.sha }}`.