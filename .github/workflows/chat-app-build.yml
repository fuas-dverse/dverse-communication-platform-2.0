name: Chat App Build

on:
  push:
    paths:
      - "experiments/chat-app/**"
      - ".github/workflows/chat-app-build.yml"
  pull_request:
    paths:
      - "experiments/chat-app/**"
      - ".github/workflows/chat-app-build.yml"
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v

  backend-build:
    needs: backend-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Validate backend sources
        run: |
          python -m compileall backend
          python -m py_compile bot_agent.py

  frontend-build:
    needs: frontend-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: experiments/chat-app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=optional

      - name: Build frontend
        run: npm run build

  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: experiments/chat-app/frontend/package-lock.json

      - name: Install frontend dependencies 
        run: rm -rf node_modules package-lock.json && npm install

      - name: Run frontend tests
        run: npm run test

  sonarqube:
    needs:
      - backend-test
      - backend-build
      - frontend-test
      - frontend-build
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Skip SonarQube when not configured
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo "SONAR_TOKEN or SONAR_HOST_URL is not configured; skipping SonarQube scan."

      - name: Run SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: sonarsource/sonarqube-scan-action@v2.3.0
        with:
          args: >
            -Dsonar.projectKey=dverse-chat-app
            -Dsonar.projectName=Dverse Chat App
            -Dsonar.projectBaseDir=experiments/chat-app
            -Dsonar.sources=backend,frontend/src
            -Dsonar.tests=backend/tests,frontend/tests
            -Dsonar.exclusions=frontend/dist/**,frontend/node_modules/**,backend/__pycache__/**,backend/chatapp.db
            -Dsonar.sourceEncoding=UTF-8