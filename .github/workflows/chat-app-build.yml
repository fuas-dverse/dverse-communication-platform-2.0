name: DVerse Communications Platform

concurrency:
  group: chat-app-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - develop
      - "feature/**"
    paths:
      - "experiments/chat-app/**"
      - ".github/workflows/chat-app-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experiments/chat-app/**"
      - ".github/workflows/chat-app-build.yml"
  workflow_dispatch:

jobs:
  backend-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: |
          pip install ruff
          ruff check backend

  backend-test:
    needs: backend-lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: experiments/chat-app/.venv
          key: venv-${{ runner.os }}-3.11-${{ hashFiles('experiments/chat-app/backend/requirements.txt') }}

      - name: Install backend dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements.txt
          .venv/bin/pip install coverage

      - name: Run backend tests with coverage
        run: |
          PYTHONPATH=. .venv/bin/coverage run --source=backend -m unittest discover -s backend/tests -v
          .venv/bin/coverage xml -o coverage.xml

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: experiments/chat-app/coverage.xml

  backend-build:
    needs: backend-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: experiments/chat-app/.venv
          key: venv-${{ runner.os }}-3.11-${{ hashFiles('experiments/chat-app/backend/requirements.txt') }}

      - name: Install backend dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements.txt

      - name: Validate backend sources
        run: |
          .venv/bin/python -m compileall backend
          .venv/bin/python -m py_compile bot_agent.py

  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests with coverage
        run: bun run vitest run --coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: experiments/chat-app/frontend/coverage/lcov.info
          if-no-files-found: error

  frontend-build:
    needs: frontend-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

  codacy:
    needs:
      - backend-lint
      - backend-test
      - backend-build
      - frontend-test
      - frontend-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CODACY_KEY: ${{ secrets.CODACY_KEY }}

    steps:
      - name: Skip Codacy when not configured
        if: ${{ env.CODACY_KEY == '' }}
        run: echo "CODACY_KEY is not configured; skipping Codacy analysis."

      - name: Download backend coverage
        if: ${{ env.CODACY_KEY != '' }}
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend

      - name: Download frontend coverage
        if: ${{ env.CODACY_KEY != '' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/frontend

      - name: Upload backend coverage to Codacy
        if: ${{ env.CODACY_KEY != '' }}
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_KEY }}
          coverage-reports: coverage/backend/coverage.xml
          language: Python

      - name: Upload frontend coverage to Codacy
        if: ${{ env.CODACY_KEY != '' }}
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_KEY }}
          coverage-reports: coverage/frontend/lcov.info
          language: TypeScript