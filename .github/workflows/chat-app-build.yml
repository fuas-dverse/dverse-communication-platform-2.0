name: DVerse Communications Platform

on:
  push:
    paths:
      - "experiments/chat-app/**"
      - ".github/workflows/chat-app-build.yml"
  pull_request:
    paths:
      - "experiments/chat-app/**"
      - ".github/workflows/chat-app-build.yml"
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Run backend tests with coverage
        run: |
          pip install coverage
          coverage run -m unittest discover -s backend/tests -v
          coverage xml -o coverage.xml

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: experiments/chat-app/coverage.xml

  backend-build:
    needs: backend-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Validate backend sources
        run: |
          python -m compileall backend
          python -m py_compile bot_agent.py

  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: rm -rf node_modules package-lock.json && npm install

      - name: Run frontend tests with coverage
        run: npm run test -- --coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Upload frontend coverage to Codacy
        if: ${{ env.CODACY_KEY != '' }}
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_KEY }}
          coverage-reports: coverage/lcov.info
          language: TypeScript

  frontend-build:
    needs: frontend-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: rm -rf node_modules package-lock.json && npm install 

      - name: Build frontend
        run: npm run build

  codacy:
    needs:
      - backend-test
      - backend-build
      - frontend-test
      - frontend-build
    runs-on: ubuntu-latest
    env:
      CODACY_KEY: ${{ secrets.CODACY_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip Codacy when not configured
        if: ${{ env.CODACY_KEY == '' }}
        run: echo "CODACY_KEY is not configured; skipping Codacy analysis."

      - name: Download backend coverage
        if: ${{ env.CODACY_KEY != '' }}
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend

      - name: Download frontend coverage
        if: ${{ env.CODACY_KEY != '' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/frontend

      - name: Upload backend coverage to Codacy
        if: ${{ env.CODACY_KEY != '' }}
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_KEY }}
          coverage-reports: coverage/backend/coverage.xml
          language: Python

      - name: Upload frontend coverage to Codacy
        if: ${{ env.CODACY_KEY != '' }}
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_KEY }}
          coverage-reports: coverage/frontend/lcov.info
          language: TypeScript

      - name: Run Codacy Analysis
        if: ${{ env.CODACY_KEY != '' }}
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          project-token: ${{ secrets.CODACY_KEY }}
          upload: true
          directory: experiments/chat-app
          exclude-paths: |
            frontend/dist
            frontend/node_modules
            backend/__pycache__
            backend/chatapp.db