name: Chat App Build

on:
  push:
    paths:
      - "experiments/chat-app/**"
      - ".github/workflows/chat-app-build.yml"
  pull_request:
    paths:
      - "experiments/chat-app/**"
      - ".github/workflows/chat-app-build.yml"
  workflow_dispatch:

jobs:
  backend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Validate backend sources
        run: |
          python -m compileall backend
          python -m py_compile bot_agent.py

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/chat-app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: experiments/chat-app/frontend/package-lock.json

      - name: CI
        run: npm ci
      - name: Install frontend dependencies
        run: npm install --include=optional

      - name: Build frontend
        run: npm run build