[package]
name    = "zenoh-chat-abel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zenoh-chat"
path = "src/main.rs"

[dependencies]
# Zenoh peer-to-peer messaging
zenoh     = { version = "1.9.0", features = ["default"] }

# Serialization
serde      = { version = "1",    features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto       = true