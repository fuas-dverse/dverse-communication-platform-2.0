services:
  zenoh-router:
    image: eclipse/zenoh:latest
    container_name: chatapp-zenoh
    ports:
      - "7447:7447/tcp"
      - "7447:7447/udp"
      - "8000:8000/tcp" # REST API (optional)
    command: --rest-http-port 8000
    restart: unless-stopped
    networks:
      - chatapp

  ollama:
    image: ollama/ollama
    container_name: chatapp-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - chatapp

    # ── GPU support (uncomment if you have an NVIDIA GPU) ──────────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama_data:

networks:
  chatapp:
    driver: bridge
