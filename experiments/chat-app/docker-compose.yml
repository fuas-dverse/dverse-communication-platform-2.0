services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatapp-backend
    ports:
      - "8080:8080"
    environment:
      - OTEL_ENABLED=false
      - DB_PATH=/data/chatapp.db
      - BRIDGE_HOST=host.docker.internal
    volumes:
      - backend_data:/data
      - ./backend:/app/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - chatapp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatapp-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chatapp

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: chatapp-jaeger
    ports:
      - "16686:16686" # Jaeger UI  →  http://localhost:16686
      # OTLP ports are internal only — the collector forwards here
    restart: unless-stopped
    networks:
      - chatapp

  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: chatapp-otelcol
    ports:
      - "4317:4317"   # OTLP gRPC  (backend / Rust services → collector)
      - "4318:4318"   # OTLP HTTP  (backend → collector, default)
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
      - loki
    restart: unless-stopped
    networks:
      - chatapp

  loki:
    image: grafana/loki:3.2.0
    container_name: chatapp-loki
    # No host port published — Loki is only spoken to from inside the
    # compose network (collector pushes, Grafana queries).  Add
    # `ports: ["3100:3100"]` here if you want to curl Loki directly from
    # the host.
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - chatapp

  prometheus:
    image: prom/prometheus:latest
    container_name: chatapp-prometheus
    ports:
      - "9090:9090"   # Prometheus UI  →  http://localhost:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - otelcol
    restart: unless-stopped
    networks:
      - chatapp

  grafana:
    image: grafana/grafana:11.4.0
    container_name: chatapp-grafana
    ports:
      - "3000:3000"   # Grafana UI  →  http://localhost:3000
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - chatapp

volumes:
  prometheus_data:
  grafana_data:
  backend_data:
  loki_data:

networks:
  chatapp:
    driver: bridge
