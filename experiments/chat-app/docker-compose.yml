services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatapp-backend
    ports:
      - "8080:8080"
    volumes:
      - ./chatapp.db:/app/chatapp.db
    restart: unless-stopped
    networks:
      - chatapp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatapp-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chatapp

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: chatapp-jaeger
    ports:
      - "16686:16686" # Jaeger UI  →  http://localhost:16686
      # OTLP ports are internal only — the collector forwards here
    restart: unless-stopped
    networks:
      - chatapp

  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: chatapp-otelcol
    ports:
      - "4317:4317"   # OTLP gRPC  (backend → collector)
      - "4318:4318"   # OTLP HTTP  (backend → collector, default)
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
    restart: unless-stopped
    networks:
      - chatapp

  prometheus:
    image: prom/prometheus:latest
    container_name: chatapp-prometheus
    ports:
      - "9090:9090"   # Prometheus UI  →  http://localhost:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - otelcol
    restart: unless-stopped
    networks:
      - chatapp

  grafana:
    image: grafana/grafana:11.4.0
    container_name: chatapp-grafana
    ports:
      - "3000:3000"   # Grafana UI  →  http://localhost:3000
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - chatapp

volumes:
  prometheus_data:
  grafana_data:

networks:
  chatapp:
    driver: bridge
