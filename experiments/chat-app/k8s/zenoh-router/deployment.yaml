apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenoh-router
  namespace: dverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zenoh-router
  template:
    metadata:
      labels:
        app: zenoh-router
    spec:
      containers:
        - name: zenoh-router
          image: eclipse/zenoh:latest
          ports:
            - containerPort: 7447
              protocol: TCP
            - containerPort: 7447
              protocol: UDP
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
