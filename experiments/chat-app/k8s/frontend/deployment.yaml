# Build: docker build --build-arg VITE_API_BASE="" -t REGISTRY/dverse-frontend:latest experiments/chat-app/frontend/
# VITE_API_BASE="" → frontend JS uses relative URLs → nginx in this pod proxies /api/ to backend:8080.
# Replace REGISTRY with your container registry (e.g. ghcr.io/your-org).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: REGISTRY/dverse-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
