apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: dverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:latest
          ports:
            - containerPort: 16686
            - containerPort: 4317
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
