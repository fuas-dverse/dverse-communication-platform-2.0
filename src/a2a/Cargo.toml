[package]
name = "a2a"
version = "0.1.0"
edition = "2024"

[lib]
name = "a2a"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
zenoh = { version = "1.8.0", default-features = false, features = ["transport_tcp"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
