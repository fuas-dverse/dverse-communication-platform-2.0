[package]
name = "bot-framework"
version = "0.1.0"
edition = "2024"

[lib]
name = "bot_framework"
path = "src/lib.rs"

[[bin]]
name = "bot-framework"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "5"
toml = "1"
clap = { version = "4", features = ["derive", "env"] }
rcgen = "0.13"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "net",
    "fs",
    "io-util",
] }
# Matches the router's transport set — TCP+TLS only.
zenoh = { version = "1.8.0", default-features = false, features = [
    "auth_pubkey",
    "auth_usrpwd",
    "transport_compression",
    "transport_multilink",
    "transport_tcp",
    "transport_tls",
] }
keyring = { version = "3", features = ["sync-secret-service", "apple-native", "windows-native"] }
x509-parser = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Shared OTLP-aware tracing bootstrap.  bot_framework::logging::init()
# delegates to dverse_obs::init() so the framework binary and every
# downstream service get the same OTLP behaviour from a single call site.
dverse-obs = { path = "../dverse_obs" }
vodozemac = "0.10.0"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8", "pem"] }

[dev-dependencies]
tempfile = "3"
