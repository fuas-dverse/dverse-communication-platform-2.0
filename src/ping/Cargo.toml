[package]
name = "dverse-ping"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dverse-ping"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bot-framework = { path = "../bot_framework" }
# Direct dep so ping can pass its own service.name into the OTLP
# resource attributes instead of inheriting bot_framework::logging's
# default.  Stdout-only behaviour is identical when
# OTEL_EXPORTER_OTLP_ENDPOINT is unset.
dverse-obs = { path = "../dverse_obs" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
] }
zenoh = { version = "1.8.0", default-features = false, features = [
    "auth_pubkey",
    "auth_usrpwd",
    "transport_compression",
    "transport_multilink",
    "transport_tcp",
    "transport_tls",
] }
tracing = "0.1"
