[package]
name = "dverse-agent-a"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "agent-a"
path = "src/main.rs"

[dependencies]
a2a = { path = "../a2a" }
anyhow = "1"
bot-framework = { path = "../bot_framework" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "io-std",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
zenoh = { version = "1.8.0", default-features = false, features = ["transport_tcp"] }
