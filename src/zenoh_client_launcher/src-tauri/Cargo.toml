[package]
name = "zenoh-client-launcher"
version = "0.1.0"
description = "DVerse — Tauri desktop app (router + bot launcher)"
authors = []
license = ""
repository = ""
edition = "2021"

[lib]
name = "zenoh_client_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zenoh-client-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
mdns-sd = "0.13"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
bot-framework = { path = "../../bot_framework" }
a2a           = { path = "../../a2a" }
anyhow        = "1"
# Embed the real router (mode=router, TLS, ACL, agent inventory).
# default-features=false keeps eframe/egui out of this binary.
zenoh-router = { path = "../../zenoh_router", default-features = false }
zenoh = { version = "1.8.0", default-features = false, features = [
    "transport_tcp",
    "transport_tls",
] }
dirs = "5"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
